; SmartBin firmware: one ESP32 DevKit (38-pin, ESP32-WROOM-32) drives both bins.
; Build + flash from the Pi:  ./scripts/flash.sh
; No external libraries: HX711 is bit-banged, servos use the LEDC peripheral.

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags = -DCORE_DEBUG_LEVEL=0
